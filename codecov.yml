# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 70%
        threshold: 5%
    patch:
      default:
        target: 85%

# Ignore paths from coverage calculation.
# HAL backends need real GPU hardware and cannot be unit-tested meaningfully.
# Use ** globs so nested packages (hal/vulkan/..., etc.) are excluded from patch.
ignore:
  - "hal/**"
  - "examples/**"
  - "cmd/**"
  - "tmp/**"

# Go-specific parser settings
parsers:
  go:
    partials_as_hits: false

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false
