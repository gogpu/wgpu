name: CI

# CI Strategy:
# - Tests run on Linux, macOS, and Windows (cross-platform GPU library)
# - Go 1.25+ required (matches go.mod requirement)
# - Pure Go implementation via goffi (requires CGO_ENABLED=0 on Unix)
# - Integration tests with Mesa software renderer on Linux
#
# Branch Strategy (GitHub Flow):
# - main branch: Production-ready code
# - Feature branches: Tested via pull_request trigger
# - Pull requests: Must pass all checks before merge

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # goffi requires CGO_ENABLED=0 for pure Go FFI on Unix
  CGO_ENABLED: 0

jobs:
  # Integration against canonical goffi and the exact merged WebGPU Android
  # source. The ephemeral go.work injects the change until it is released.
  android-arm64-preview:
    name: Android arm64 preview - Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.12', '1.26.5']

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Checkout exact merged WebGPU Android surface source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: go-webgpu/webgpu
        ref: a801aed7399042e5564ef76fc9f075da5cb70081
        path: .ci/webgpu
        persist-credentials: false

    - name: Verify exact WebGPU merge
      working-directory: .ci/webgpu
      run: test "$(git rev-parse HEAD)" = a801aed7399042e5564ef76fc9f075da5cb70081

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Install Android NDK r29
      run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install 'ndk;29.0.14206865'

    - name: Check Android arm64 source, tests, and ELF dependencies
      env:
        WEBGPU_DIR: ${{ github.workspace }}/.ci/webgpu
        WEBGPU_EXPECTED_HEAD: a801aed7399042e5564ef76fc9f075da5cb70081
        WEBGPU_EXPECTED_PATCH: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      run: |
        export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
        ./scripts/check-android-arm64-preview.sh

  # Build verification - Cross-platform
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25']

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build all packages
      run: go build ./...

  # Cross-compile verification — ADR-047 unified public API
  # Ensures Surface (and other build-tagged types) compile on all targets.
  # Native is already covered by the build job; this adds browser and rust.
  cross-compile:
    name: Cross-compile - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: js, goarch: wasm, tags: '', name: 'browser' }
          - { goos: linux, goarch: amd64, tags: 'rust', name: 'rust' }
          # 32-bit int: a constant that fits int on 64-bit targets does not
          # there (P1-INFRA-008: TrackerIndex bounds and math.MaxUint32). Build
          # only — there is no GPU on 386 and no test runs. windows rather than
          # linux: goffi's internal/syscall has no linux/386 files, so the
          # linux/386 combination cannot build in the ecosystem.
          - { goos: windows, goarch: "386", tags: '', name: '386' }
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.25'
        cache: true

    - name: Cross-compile ${{ matrix.name }} backend
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: go build ${{ matrix.tags && format('-tags={0}', matrix.tags) || '' }} .

  # Unit tests - Cross-platform
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Codecov uploads with OIDC; no other job needs an id token.
    permissions:
      contents: read
      id-token: write
    strategy:
      # Each OS runs different backends (DX12, Metal, Vulkan/GLES), so one
      # OS failing must not cancel the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25']

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run go vet
      if: matrix.os == 'ubuntu-latest'
      # Skip hal/vulkan/vk and hal/gles due to intentional unsafe.Pointer FFI usage
      run: |
        go vet $(go list ./... | grep -v '/hal/vulkan/vk$' | grep -v '/hal/gles')

    # The build users ship: CGO_ENABLED=0, so goffi runs its fakecgo path.
    - name: Run tests
      shell: bash
      run: go test -v -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

    # Race detection uses the toolchain's -race (ThreadSanitizer, needs cgo).
    # With CGO_ENABLED=1 goffi links the real runtime/cgo instead of its
    # fakecgo, so this step tests that path, not the one above. A non-std cgo
    # package in the test binary would fail to link here on Linux (goffi#72).
    - name: Run tests with the race detector
      shell: bash
      env:
        CGO_ENABLED: 1
      run: go test -race -count=1 ./...

    - name: Verify coverage file
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        if [ -f coverage.txt ]; then
          echo "coverage.txt found ($(wc -l < coverage.txt) lines)"
        else
          echo "coverage.txt not found, generating separately..."
          go test -coverprofile=coverage.txt -covermode=atomic ./... || true
        fi

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        use_oidc: true
        files: ./coverage.txt
        flags: unittests
        name: codecov-wgpu

  # GLES/EGL Integration Test - Linux with Mesa Surfaceless
  integration-gles:
    name: Integration - GLES/EGL (Linux + Mesa Surfaceless)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.25'
        cache: true

    - name: Install Mesa libraries for headless EGL
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libegl1-mesa-dev \
          libgbm-dev \
          libgl1-mesa-dri \
          mesa-utils

    - name: Verify Mesa installation
      run: |
        echo "=== Installed packages ==="
        dpkg -l | grep -E 'mesa|egl' | head -10
        echo ""
        echo "=== Library files ==="
        ls -la /usr/lib/x86_64-linux-gnu/libEGL* 2>/dev/null || true
        ls -la /usr/lib/x86_64-linux-gnu/libGL* 2>/dev/null || true
        echo ""
        echo "=== Mesa DRI drivers ==="
        ls -la /usr/lib/x86_64-linux-gnu/dri/ 2>/dev/null | head -10 || true

    - name: Download dependencies
      run: go mod download

    - name: Build GLES backend
      run: go build -v ./hal/gles/...

    - name: Run GLES integration test (surfaceless)
      env:
        # CRITICAL: Unset display variables to force surfaceless platform
        DISPLAY: ""
        WAYLAND_DISPLAY: ""
        # Force software rendering with llvmpipe
        LIBGL_ALWAYS_SOFTWARE: "1"
        MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
      run: |
        echo "=== Running with surfaceless EGL platform ==="
        echo "DISPLAY='$DISPLAY'"
        echo "WAYLAND_DISPLAY='$WAYLAND_DISPLAY'"
        echo "LIBGL_ALWAYS_SOFTWARE='$LIBGL_ALWAYS_SOFTWARE'"
        echo ""
        go test -v -tags integration ./hal/gles/...

    - name: Run GLES integration test on an OpenGL ES context (surfaceless)
      # Mesa offers desktop GL, so the backend never takes its ES paths here
      # unless the wgpu_gles_force_es test tag makes every context ES.
      # WGPU_REQUIRE turns a missing EGL context into a failure, not a skip.
      env:
        DISPLAY: ""
        WAYLAND_DISPLAY: ""
        LIBGL_ALWAYS_SOFTWARE: "1"
        MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
        WGPU_REQUIRE: "gles"
      run: go test -v -tags "integration wgpu_gles_force_es" ./hal/gles/...

    - name: Test EGL library loading
      run: |
        # Verify that EGL can be loaded at runtime
        echo "Testing EGL library availability..."
        ldconfig -p | grep -E 'libEGL|libGL' | head -5
        echo "EGL libraries available for runtime loading"

  # Linting
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.25'
        cache: true

    # The golangci-lint version and its sha256 are pinned in the composite
    # action, which restores the verified binary from the Actions cache, so
    # lint does not depend on GitHub Releases being reachable on every run
    # (on 2026-11-08 the release download URL returned 504 for over an hour).
    # Bump golangci-lint in gogpu/.github, then move this pin; keep
    # lint-targets on the same commit.
    - name: Set up golangci-lint
      uses: gogpu/.github/actions/setup-golangci-lint@cdb7bd4a5bd3852541a05f0fa1fa92b09d1ee732 # main 2026-11-08, golangci-lint v2.15.0

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        install-mode: none
        args: --timeout=5m

  # Lint the other desktop targets. The job above type-checks only the linux
  # files, so code under darwin or windows build tags (hal/metal, hal/dx12,
  # hal/gles/wgl) is never linted otherwise. The code is pure Go
  # (CGO_ENABLED=0), so GOOS/GOARCH on a linux runner load exactly that
  # target's files; a target that fails to type-check exits non-zero, never
  # "0 issues". One GOARCH per GOOS is enough: the module has no arch-specific
  # files and no darwin/windows + GOARCH build tags (checked 2026-11-08), so
  # only darwin/arm64 and windows/amd64 are added. GOOS-named tags in the
  # .golangci.yml build-tags would not switch the target and are not used.
  lint-targets:
    name: Lint - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.25'
        cache: true

    - name: Set up golangci-lint
      uses: gogpu/.github/actions/setup-golangci-lint@cdb7bd4a5bd3852541a05f0fa1fa92b09d1ee732 # main 2026-11-08, golangci-lint v2.15.0

    # GOOS/GOARCH go on the lint step only: the binary above stays linux/amd64.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"
      with:
        install-mode: none
        args: --timeout=5m

  # Code formatting check
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.25'
        cache: true

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "ERROR: The following files are not formatted:"
          gofmt -l .
          echo ""
          echo "Run 'go fmt ./...' to fix formatting issues."
          exit 1
        fi
        echo "All files are properly formatted"

  # Dependency freshness check
  # Uses go-mod-outdated (https://github.com/psampaz/go-mod-outdated)
  # Non-blocking: reports outdated deps as warnings; never fails the workflow.
  deps:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.25'
        cache: true

    # go-mod-outdated is pinned in tools/go.mod (checksums in tools/go.sum,
    # updated by Dependabot), never installed @latest.
    - name: Check direct dependencies for updates
      run: |
        echo "## Direct Dependencies with Updates"
        OUTDATED=$(go list -u -m -json all 2>/dev/null | go tool -modfile=tools/go.mod go-mod-outdated -update -direct || true)
        if [ -n "$OUTDATED" ]; then
          echo "$OUTDATED"
          echo "::warning::Some direct dependencies have updates available"
        else
          echo "All direct dependencies are up to date!"
        fi

    - name: Check ecosystem dependencies
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "## Ecosystem Dependencies"
        WARNINGS=0

        check_dep() {
          local DEP=$1 REPO=$2
          LOCAL=$(grep "$DEP" go.mod 2>/dev/null | grep -v "^module" | awk '{print $2}')
          [ -z "$LOCAL" ] && return 0

          LATEST=$(gh release view --repo "$REPO" --json tagName -q '.tagName' 2>/dev/null || echo "")
          [ -z "$LATEST" ] && { echo "⚠️  $DEP: $LOCAL (cannot verify)"; return 0; }

          if [ "$LOCAL" = "$LATEST" ]; then
            echo "✅ $DEP: $LOCAL"
          else
            echo "❌ $DEP: $LOCAL → $LATEST available"
            WARNINGS=$((WARNINGS + 1))
          fi
        }

        check_dep "github.com/gogpu/naga" "gogpu/naga"
        check_dep "github.com/go-webgpu/goffi" "go-webgpu/goffi"

        [ $WARNINGS -gt 0 ] && echo "::warning::$WARNINGS ecosystem dep(s) outdated"
        exit 0

  # The one check the main-protection ruleset requires, by this exact job name:
  # renaming the job silently drops the requirement. Jobs and the matrix can
  # change without touching the ruleset; a new required job goes into `needs`.
  # `if: always()` and the explicit result check matter: a job skipped because a
  # job it needs failed counts as passed for a required check.
  gate:
    name: Test
    if: always()
    needs: [android-arm64-preview, build, cross-compile, test, integration-gles, lint, lint-targets, formatting, deps]
    runs-on: ubuntu-latest
    steps:
    - name: Every required job succeeded
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "results: $RESULTS"
        for r in $RESULTS; do
          if [ "$r" != success ]; then echo "a required job ended with: $r"; exit 1; fi
        done
